name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version || google-chrome-stable --version

      - name: Install Playwright system libraries
        run: npx playwright install-deps chrome

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: true
          AUTH_SECRET: ci-auth-secret-not-for-production-use-32

  # Separate from `test`. The default path stays the SQLite job above.
  # This job applies prisma/migrations-postgres/*.sql to an empty database,
  # checks that schema against the Prisma datamodel, then runs the unit tests.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hn
          POSTGRES_PASSWORD: hn
          POSTGRES_DB: hackernews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hn -d hackernews"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://hn:hn@localhost:5432/hackernews?schema=public
      AUTH_SECRET: ci-auth-secret-not-for-production-use-32
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migration SQL and check for drift
        run: bash scripts/apply-postgres-migration.sh --generate

      - name: Unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://hn:hn@localhost:5432/hackernews?schema=public
          AUTH_SECRET: ci-auth-secret-not-for-production-use-32

  # Separate from `test` and `postgres`. Default rate limiting stays in memory.
  # This job runs the Redis-backed limit against a real Redis server.
  redis:
    name: redis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rate limit against Redis
        run: npx vitest run tests/unit/rate-limit-redis-live.test.ts
        env:
          REDIS_INTEGRATION: "1"
          REDIS_URL: redis://127.0.0.1:6379/0
          AUTH_SECRET: ci-auth-secret-not-for-production-use-32
